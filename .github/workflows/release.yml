name: Publish approved pre-release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Exact approved release tag
        required: true
        type: choice
        options:
          - v0.4.0-beta.1
      confirm:
        description: Type PUBLISH-PRE-RELEASE
        required: true
        type: string

jobs:
  release:
    name: validate and publish Windows pre-release
    if: inputs.release_tag == 'v0.4.0-beta.1' && inputs.confirm == 'PUBLISH-PRE-RELEASE'
    runs-on: windows-latest
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
      - name: Check out the approved tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.release_tag }}
          persist-credentials: false
      - name: Set up Python 3.14.6
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.6"
          cache: pip
      - name: Install locked environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-lock.txt
          python -m pip install -e . --no-deps
      - name: Verify tag, tests and security gates
        shell: powershell
        run: |
          python scripts/check_version.py --tag "${{ inputs.release_tag }}"
          python -m pytest --cov=quant_guardian --cov-report=term-missing --cov-report=json
          python scripts/check_coverage.py coverage.json
          .\scripts\test-install-safety.ps1
          python -m ruff check .
          python -m bandit -c pyproject.toml -r src -ll
          python -m pip_audit -r requirements-lock.txt --strict
      - name: Build and package
        shell: powershell
        run: |
          $python = Join-Path $env:pythonLocation "python.exe"
          .\scripts\build.ps1 -Python $python
          .\scripts\package-release.ps1 -Python $python -ReleaseTag "${{ inputs.release_tag }}" -SkipBuild
      - name: Executable smoke tests
        shell: powershell
        run: |
          $exe = ".\dist\Quant Guardian\Quant Guardian.exe"
          $gateway = ".\dist\Quant Guardian\Quant Guardian Gateway.exe"
          foreach ($arguments in @("--version", "--simulate", "--ui-smoke")) {
            $process = Start-Process -FilePath $exe -ArgumentList $arguments -Wait -PassThru -WindowStyle Hidden
            if ($process.ExitCode -ne 0) {
              throw "Smoke test failed: $arguments exit $($process.ExitCode)"
            }
          }
          $gatewayProcess = Start-Process -FilePath $gateway -ArgumentList "--version" -Wait -PassThru -WindowStyle Hidden
          if ($gatewayProcess.ExitCode -ne 0) {
            throw "Gateway smoke test failed: --version exit $($gatewayProcess.ExitCode)"
          }
      - name: Attest release assets
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release-assets/*
      - name: Publish pre-release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ inputs.release_tag }}" .\release-assets\* --verify-tag --prerelease --title "Quant Guardian ${{ inputs.release_tag }}" --notes-file .\docs\RELEASE_NOTES_v0.4.0-beta.1.md
