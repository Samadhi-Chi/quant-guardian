[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-guardian"
dynamic = ["version"]
description = "Safety-first QMT health monitoring and controlled recovery for Windows"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Joe.Sun" }]
keywords = ["qmt", "xtquant", "quantclass", "monitoring", "windows"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Win32 (MS Windows)",
  "Intended Audience :: Financial and Insurance Industry",
  "Operating System :: Microsoft :: Windows :: Windows 10",
  "Operating System :: Microsoft :: Windows :: Windows 11",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: System :: Monitoring",
]
dependencies = [
  "psutil>=5.9,<8",
  "PySide6>=6.7,<7",
  "qrcode>=8.2,<9",
  "tzdata>=2024.1; platform_system == 'Windows'",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0.3,<10",
  "pytest-cov>=6,<8",
  "PyInstaller>=6.18,<7",
  "ruff>=0.8,<1",
  "bandit[toml]>=1.8,<2",
  "pip-audit>=2.7,<3",
  "cyclonedx-bom>=5,<8",
]

[project.urls]
Homepage = "https://github.com/Samadhi-Chi/quant-guardian"
Documentation = "https://github.com/Samadhi-Chi/quant-guardian#readme"
Issues = "https://github.com/Samadhi-Chi/quant-guardian/issues"
Source = "https://github.com/Samadhi-Chi/quant-guardian"

[project.scripts]
quant-guardian = "quant_guardian.cli:main"
quant-guardian-gateway = "quant_guardian.gateway.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.dynamic]
version = {attr = "quant_guardian.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
branch = true
source = ["quant_guardian"]

[tool.coverage.report]
fail_under = 75
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501", "B008"]

[tool.bandit]
exclude_dirs = ["tests", "build", "dist"]
